<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824" role="img" aria-label="Vaelos Silicon logo">
  <!-- Same geometry as packaging/make-icon.swift (y flipped for SVG). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2140"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161C33"/>
      <stop offset="1" stop-color="#0A0D19"/>
    </linearGradient>
    <linearGradient id="neon" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <pattern id="grid" width="41.2" height="41.2" patternUnits="userSpaceOnUse" x="100" y="100">
      <path d="M0 0H41.2M0 0V41.2" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2" fill="none"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" fill="url(#grid)" clip-path="url(#squircle)"/>

  <!-- Pins: 7 per side -->
  <g fill="#8EA2FF" fill-opacity="0.55">
    <rect x="323" y="237" width="18" height="46" rx="5"/><rect x="383" y="237" width="18" height="46" rx="5"/>
    <rect x="443" y="237" width="18" height="46" rx="5"/><rect x="503" y="237" width="18" height="46" rx="5"/>
    <rect x="563" y="237" width="18" height="46" rx="5"/><rect x="623" y="237" width="18" height="46" rx="5"/>
    <rect x="683" y="237" width="18" height="46" rx="5"/>
    <rect x="323" y="741" width="18" height="46" rx="5"/><rect x="383" y="741" width="18" height="46" rx="5"/>
    <rect x="443" y="741" width="18" height="46" rx="5"/><rect x="503" y="741" width="18" height="46" rx="5"/>
    <rect x="563" y="741" width="18" height="46" rx="5"/><rect x="623" y="741" width="18" height="46" rx="5"/>
    <rect x="683" y="741" width="18" height="46" rx="5"/>
    <rect x="237" y="323" width="46" height="18" rx="5"/><rect x="237" y="383" width="46" height="18" rx="5"/>
    <rect x="237" y="443" width="46" height="18" rx="5"/><rect x="237" y="503" width="46" height="18" rx="5"/>
    <rect x="237" y="563" width="46" height="18" rx="5"/><rect x="237" y="623" width="46" height="18" rx="5"/>
    <rect x="237" y="683" width="46" height="18" rx="5"/>
    <rect x="741" y="323" width="46" height="18" rx="5"/><rect x="741" y="383" width="46" height="18" rx="5"/>
    <rect x="741" y="443" width="46" height="18" rx="5"/><rect x="741" y="503" width="46" height="18" rx="5"/>
    <rect x="741" y="563" width="46" height="18" rx="5"/><rect x="741" y="623" width="46" height="18" rx="5"/>
    <rect x="741" y="683" width="46" height="18" rx="5"/>
  </g>

  <!-- Die -->
  <rect x="277" y="277" width="470" height="470" rx="64" fill="url(#die)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="5"/>

  <!-- The V: glow, then gradient fill -->
  <polygon points="330,344 412,344 512,576 612,344 694,344 548,672 476,672" fill="#8B5CF6" filter="url(#blur)" opacity="0.9"/>
  <polygon points="330,344 412,344 512,576 612,344 694,344 548,672 476,672" fill="url(#neon)"/>
  <line x1="362" y1="414" x2="440" y2="414" stroke="#0A0D19" stroke-opacity="0.85" stroke-width="6"/>

  <!-- Circuit trace from the tip -->
  <line x1="512" y1="672" x2="512" y2="724" stroke="#22D3EE" stroke-width="8"/>
  <circle cx="512" cy="728" r="14" fill="#22D3EE"/>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
</svg>
