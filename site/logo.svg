    <rect x="741" y="443" width="46" height="18" rx="5"/><rect x="741" y="503" width="46" height="18" rx="5"/>
    <rect x="741" y="563" width="46" height="18" rx="5"/><rect x="741" y="623" width="46" height="18" rx="5"/>
    <rect x="741" y="683" width="46" height="18" rx="5"/>
